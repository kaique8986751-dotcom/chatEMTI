
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TimeChat - Passe seu tempo aqui!</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background:
        linear-gradient(
          rgba(10, 25, 47, 0.85),
          rgba(10, 25, 47, 0.85)
        ),
        url('https://images.unsplash.com/photo-1508615070457-7baeba4003ab?auto=format&fit=crop&w=1350&q=80')
        center/cover no-repeat fixed;

      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .chat-container {
      width: 100%;
      max-width: 450px;
      height: 90vh;
      max-height: 700px;

      background: rgba(15, 32, 67, 0.94);

      border-radius: 16px;

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.37);

      backdrop-filter: blur(8px);

      border: 1px solid rgba(255,255,255,0.1);

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    /* HEADER */

    .header {
      background: #0d253f;
      color: #e0f2fe;

      padding: 15px;

      text-align: center;

      border-bottom: 2px solid #1e40af;
    }

    .header h1 {
      font-size: 1.4rem;
      color: #38bdf8;
    }

    .header p {
      font-size: 0.85rem;
      color: #93c5fd;
      font-style: italic;
      margin-top: 4px;
    }

    /* PERFIL */

    .user-profile-bar {
      background: #09172a;

      padding: 10px 15px;

      display: flex;
      align-items: center;

      gap: 12px;

      border-bottom: 1px solid #1e40af;
    }

    .profile-avatar-container {
      position: relative;
      cursor: pointer;
    }

    .profile-avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      object-fit: cover;

      border: 2px solid #38bdf8;

      background: #1e293b;
    }

    .avatar-edit-overlay {
      position: absolute;

      bottom: 0;
      right: 0;

      background: #2563eb;

      color: white;

      border-radius: 50%;

      width: 16px;
      height: 16px;

      font-size: 10px;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .user-info {
      display: flex;
      flex-direction: column;

      flex: 1;
    }

    .user-info input {
      background: transparent;

      border: none;

      border-bottom: 1px dashed #38bdf8;

      color: #e0f2fe;

      font-weight: bold;

      font-size: 0.95rem;

      outline: none;

      padding: 2px 0;
    }

    .user-info label {
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* STATUS */

    .status-bar {
      padding: 8px 15px;

      background: #0a192f;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }

    .status-indicator {
      font-size: 0.8rem;
      color: #94a3b8;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-indicator.online {
      color: #4ade80;
    }

    .btn-session {
      padding: 6px 12px;

      border: none;

      border-radius: 6px;

      font-weight: bold;

      cursor: pointer;

      transition: background 0.3s;
    }

    .btn-enter {
      background: #2563eb;
      color: white;
    }

    .btn-enter:hover {
      background: #1d4ed8;
    }

    .btn-leave {
      background: #ef4444;
      color: white;
    }

    .btn-leave:hover {
      background: #dc2626;
    }

    /* CONEXÃO */

    .connection-panel {
      padding: 10px 15px;

      background: #061121;

      display: none;

      gap: 8px;

      align-items: center;

      border-bottom: 1px solid #1e40af;

      flex-direction: column;
    }

    .my-id {
      width: 100%;

      background: #0a192f;

      border: 1px solid #1e40af;

      border-radius: 6px;

      padding: 8px;

      color: #38bdf8;

      font-size: 0.75rem;

      word-break: break-all;
    }

    .connection-row {
      width: 100%;

      display: flex;

      gap: 8px;
    }

    .connection-panel input {
      flex: 1;

      padding: 8px 10px;

      border-radius: 6px;

      border: 1px solid #1e40af;

      background: #0a192f;

      color: #fff;

      font-size: 0.85rem;

      outline: none;
    }

    .btn-connect {
      padding: 8px 12px;

      background: #0284c7;

      color: white;

      border: none;

      border-radius: 6px;

      font-size: 0.85rem;

      font-weight: bold;

      cursor: pointer;
    }

    .btn-connect:hover {
      background: #0369a1;
    }

    /* MENSAGENS */

    .messages-area {
      flex: 1;

      padding: 15px;

      overflow-y: auto;

      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    .message-wrapper {
      display: flex;

      gap: 8px;

      max-width: 85%;

      align-items: flex-end;
    }

    .message-wrapper.sent {
      align-self: flex-end;

      flex-direction: row-reverse;
    }

    .message-wrapper.received {
      align-self: flex-start;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;

      border-radius: 50%;

      object-fit: cover;

      border: 1px solid #38bdf8;

      flex-shrink: 0;
    }

    .message {
      padding: 10px 14px;

      border-radius: 12px;

      font-size: 0.95rem;

      line-height: 1.4;

      word-wrap: break-word;

      display: flex;

      flex-direction: column;

      min-width: 70px;
    }

    .sender-name {
      font-size: 0.75rem;

      font-weight: bold;

      color: #38bdf8;

      margin-bottom: 2px;
    }

    .message img.chat-image {
      max-width: 100%;

      max-height: 300px;

      object-fit: contain;

      border-radius: 8px;

      margin-top: 4px;
      margin-bottom: 4px;
    }

    .timestamp {
      font-size: 0.7rem;

      opacity: 0.75;

      align-self: flex-end;

      margin-top: 4px;
    }

    .message.system {
      align-self: center;

      background: rgba(30, 58, 138, 0.5);

      color: #93c5fd;

      font-size: 0.8rem;

      border: 1px solid #1e40af;

      text-align: center;

      padding: 6px 12px;

      border-radius: 12px;

      max-width: 90%;
    }

    .message-wrapper.sent .message {
      background: #2563eb;

      color: #ffffff;

      border-bottom-right-radius: 2px;
    }

    .message-wrapper.received .message {
      background: #1e293b;

      color: #e2e8f0;

      border-bottom-left-radius: 2px;

      border: 1px solid #334155;
    }

    /* INPUT */

    .input-area {
      padding: 12px;

      background: #0d253f;

      display: flex;

      gap: 8px;

      border-top: 1px solid #1e40af;

      align-items: center;
    }

    .input-area input[type="text"] {
      flex: 1;

      padding: 10px 14px;

      border-radius: 20px;

      border: 1px solid #1e40af;

      background: #0a192f;

      color: #ffffff;

      outline: none;

      min-width: 0;
    }

    .input-area input[type="text"]:focus {
      border-color: #38bdf8;
    }

    .btn-action {
      padding: 10px 14px;

      background: #0284c7;

      color: white;

      border: none;

      border-radius: 20px;

      font-weight: bold;

      cursor: pointer;
    }

    .btn-action:hover {
      background: #0369a1;
    }

    .btn-img-upload {
      background: #1e40af;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      width: 40px;
      height: 40px;

      cursor: pointer;

      flex-shrink: 0;
    }

    .btn-action:disabled,
    .btn-img-upload.disabled,
    .input-area input:disabled,
    .btn-connect:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #image-file,
    #profile-file {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 500px) {

      body {
        padding: 0;
      }

      .chat-container {
        height: 100vh;
        max-height: none;

        border-radius: 0;
      }

      .message-wrapper {
        max-width: 90%;
      }

      .btn-action {
        padding: 10px 12px;
      }
    }
  </style>
</head>

<body>

<div class="chat-container">

  <!-- HEADER -->

  <div class="header">
    <h1>TimeChat</h1>
    <p>Passe seu tempo aqui!</p>
  </div>

  <!-- PERFIL -->

  <div class="user-profile-bar">

    <div
      class="profile-avatar-container"
      onclick="triggerProfileUpload()"
    >
      <img
        id="profile-preview"
        class="profile-avatar"
        src=""
        alt="Foto de perfil"
      >

      <div class="avatar-edit-overlay">
        ✏️
      </div>
    </div>

    <input
      type="file"
      id="profile-file"
      accept="image/*"
    >

    <div class="user-info">

      <label for="username-input">
        Seu Nome / Apelido
      </label>

      <input
        type="text"
        id="username-input"
        value="Usuário"
        maxlength="15"
        autocomplete="off"
      >

    </div>

  </div>

  <!-- STATUS -->

  <div class="status-bar">

    <span
      id="status"
      class="status-indicator"
    >
      ● Fora do chat
    </span>

    <button
      id="session-btn"
      class="btn-session btn-enter"
    >
      Conectar Servidor
    </button>

  </div>

  <!-- CONEXÃO -->

  <div
    class="connection-panel"
    id="connect-panel"
  >

    <div class="my-id">
      <strong>Seu código:</strong>
      <span id="my-id"></span>
    </div>

    <div class="connection-row">

      <input
        type="text"
        id="remote-id-input"
        placeholder="Cole o código do amigo..."
        autocomplete="off"
      >

      <button
        class="btn-connect"
        id="connect-btn"
      >
        Conectar
      </button>

    </div>

  </div>

  <!-- MENSAGENS -->

  <div
    id="messages"
    class="messages-area"
  >

    <div class="message system">
      Clique em "Conectar Servidor" para iniciar.
    </div>

  </div>

  <!-- INPUT -->

  <div class="input-area">

    <label
      for="image-file"
      class="btn-img-upload"
      id="img-btn-label"
      title="Enviar imagem"
    >
      📷
    </label>

    <input
      type="file"
      id="image-file"
      accept="image/*"
      disabled
    >

    <input
      type="text"
      id="message-input"
      placeholder="Digite sua mensagem..."
      disabled
      autocomplete="off"
    >

    <button
      id="send-btn"
      class="btn-action"
      disabled
    >
      Enviar
    </button>

  </div>

</div>


<script>
  // =========================================================
  // TimeChat — P2P via PeerJS
  // ID persistente + reconexão automática
  // =========================================================

  let peer = null;
  let conn = null;
  let inChat = false;
  let myPeerId = null;
  let connecting = false;
  let reconnectTimer = null;
  let reconnectAttempts = 0;
  let intentionalDisconnect = false;

  let remoteUser = {
    name: "Usuário",
    avatar: ""
  };

  const STORAGE_KEYS = {
    peerId: "timechat_peer_id",
    remoteId: "timechat_remote_id"
  };

  let userAvatarSrc =
    localStorage.getItem("timechat_avatar") ||
    "https://api.dicebear.com/7.x/bottts/svg?seed=" +
    Math.random().toString(36).substring(2, 10);

  const statusEl = document.getElementById("status");
  const sessionBtn = document.getElementById("session-btn");
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("message-input");
  const sendBtn = document.getElementById("send-btn");
  const imageInput = document.getElementById("image-file");
  const profileInput = document.getElementById("profile-file");
  const profilePreview = document.getElementById("profile-preview");
  const usernameInput = document.getElementById("username-input");
  const connectPanel = document.getElementById("connect-panel");
  const remoteIdInput = document.getElementById("remote-id-input");
  const connectBtn = document.getElementById("connect-btn");
  const myIdEl = document.getElementById("my-id");

  profilePreview.src = userAvatarSrc;

  const savedRemoteId = localStorage.getItem(STORAGE_KEYS.remoteId);
  if (savedRemoteId) {
    remoteIdInput.value = savedRemoteId;
  }

  // ---------------------------------------------------------
  // ID permanente
  // ---------------------------------------------------------

  function generatePersistentPeerId() {
    const existing = localStorage.getItem(STORAGE_KEYS.peerId);

    if (existing) {
      return existing;
    }

    const randomPart = Math.random().toString(36).substring(2, 10);
    const timestampPart = Date.now().toString(36).slice(-4);

    const newId = "timechat-" + randomPart + timestampPart;

    localStorage.setItem(STORAGE_KEYS.peerId, newId);
    return newId;
  }

  const persistentPeerId = generatePersistentPeerId();

  // ---------------------------------------------------------
  // Perfil
  // ---------------------------------------------------------

  function triggerProfileUpload() {
    profileInput.click();
  }

  profileInput.addEventListener("change", (event) => {
    const file = event.target.files[0];
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      addSystemMessage("Selecione uma imagem válida.");
      return;
    }

    const reader = new FileReader();

    reader.onload = (e) => {
      userAvatarSrc = e.target.result;
      profilePreview.src = userAvatarSrc;

      try {
        localStorage.setItem("timechat_avatar", userAvatarSrc);
      } catch (error) {
        console.warn("Não foi possível salvar o avatar localmente.", error);
      }

      if (conn && conn.open) {
        sendUserInfo(conn);
      }
    };

    reader.readAsDataURL(file);
  });

  function getCurrentTime() {
    return new Date().toLocaleTimeString("pt-BR", {
      hour: "2-digit",
      minute: "2-digit"
    });
  }

  function getUsername() {
    return usernameInput.value.trim() || "Usuário";
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMessage(text) {
    const msg = document.createElement("div");
    msg.className = "message system";
    msg.textContent = text;
    messagesEl.appendChild(msg);
    scrollToBottom();
  }

  function enableInput() {
    inputEl.disabled = false;
    sendBtn.disabled = false;
    imageInput.disabled = false;
    document.getElementById("img-btn-label").classList.remove("disabled");
  }

  function disableInput() {
    inputEl.disabled = true;
    sendBtn.disabled = true;
    imageInput.disabled = true;
    document.getElementById("img-btn-label").classList.add("disabled");
  }

  function setStatus(text, online = false) {
    statusEl.textContent = text;
    statusEl.classList.toggle("online", online);
  }

  function saveRemoteId(id) {
    if (id) {
      localStorage.setItem(STORAGE_KEYS.remoteId, id);
    }
  }

  // ---------------------------------------------------------
  // PeerJS / sinalização
  // ---------------------------------------------------------

  function startPeer() {
    if (peer && !peer.destroyed) {
      if (peer.disconnected) {
        try {
          peer.reconnect();
        } catch (e) {
          console.error("Falha ao recuperar PeerJS:", e);
        }
      }
      return;
    }

    if (typeof Peer === "undefined") {
      connecting = false;
      setStatus("● PeerJS não carregou");
      addSystemMessage(
        "Não foi possível carregar o PeerJS. Verifique sua internet e recarregue a página."
      );
      return;
    }

    connecting = true;
    intentionalDisconnect = false;
    setStatus("● Conectando...");

    /*
      O ID é criado uma única vez e salvo no localStorage.
      Assim, o mesmo navegador volta a usar o mesmo ID.
    */
    peer = new Peer(persistentPeerId, {
      debug: 1,
      config: {
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" }
        ]
      }
    });

    peer.on("open", (id) => {
      myPeerId = id;
      inChat = true;
      connecting = false;
      reconnectAttempts = 0;

      setStatus("● Online", true);

      sessionBtn.textContent = "Desconectar";
      sessionBtn.classList.remove("btn-enter");
      sessionBtn.classList.add("btn-leave");

      connectPanel.style.display = "flex";
      myIdEl.textContent = id;

      addSystemMessage("Você está online.");
      addSystemMessage("Seu ID permanente é: " + id);

      const lastRemoteId = localStorage.getItem(STORAGE_KEYS.remoteId);

      if (lastRemoteId && lastRemoteId !== id) {
        remoteIdInput.value = lastRemoteId;

        addSystemMessage(
          "Tentando recuperar a última conexão..."
        );

        scheduleReconnect(true);
      }
    });

    // Recebe uma conexão iniciada por outro usuário.
    peer.on("connection", (incoming) => {
      if (conn && conn.open) {
        incoming.close();
        return;
      }

      conn = incoming;
      saveRemoteId(incoming.peer);
      setupConnection(conn);
    });

    peer.on("disconnected", () => {
      if (!peer || peer.destroyed || intentionalDisconnect) return;

      setStatus("● Reconectando servidor...", false);

      schedulePeerServerReconnect();
    });

    peer.on("close", () => {
      if (intentionalDisconnect) {
        peer = null;
        myPeerId = null;
        inChat = false;
        return;
      }

      peer = null;
      myPeerId = null;
      inChat = false;

      setStatus("● Servidor desconectado");
      schedulePeerRestart();
    });

    peer.on("error", (error) => {
      console.error("PeerJS:", error);
      connecting = false;

      let message = "Erro de conexão.";

      switch (error.type) {
        case "peer-unavailable":
          message = "Usuário não encontrado ou offline.";
          break;

        case "network":
          message = "Problema de rede. Tentando novamente...";
          break;

        case "server-error":
          message = "Servidor de sinalização indisponível.";
          break;

        case "socket-error":
        case "socket-closed":
          message = "A conexão de sinalização foi interrompida. Tentando novamente...";
          break;

        case "unavailable-id":
          /*
            O ID permanente já está sendo usado em outra aba/dispositivo.
            Não trocamos automaticamente o ID, pois isso quebraria a
            permanência. O usuário precisa fechar a sessão duplicada.
          */
          message =
            "Este ID permanente já está em uso. Feche a outra sessão deste usuário e tente novamente.";
          break;

        case "invalid-key":
          message = "Configuração do PeerJS inválida.";
          break;

        default:
          message =
            "Erro: " + (error.message || error.type || "desconhecido");
      }

      addSystemMessage(message);

      if (
        error.type === "network" ||
        error.type === "socket-error" ||
        error.type === "socket-closed" ||
        error.type === "server-error"
      ) {
        schedulePeerRestart();
      }

      if (error.type === "peer-unavailable") {
        connectBtn.disabled = false;

        // Tenta novamente depois, caso o outro usuário volte online.
        scheduleReconnect();
      }
    });
  }

  function schedulePeerServerReconnect() {
    if (intentionalDisconnect || !peer || peer.destroyed) return;

    clearTimeout(reconnectTimer);

    reconnectTimer = setTimeout(() => {
      if (!peer || peer.destroyed || intentionalDisconnect) return;

      try {
        if (peer.disconnected) {
          peer.reconnect();
        }
      } catch (error) {
        console.error("Falha ao reconectar ao servidor:", error);
        schedulePeerRestart();
      }
    }, 2000);
  }

  function schedulePeerRestart() {
    if (intentionalDisconnect) return;

    clearTimeout(reconnectTimer);

    reconnectAttempts++;

    const delay = Math.min(
      15000,
      2000 * Math.max(1, reconnectAttempts)
    );

    reconnectTimer = setTimeout(() => {
      if (intentionalDisconnect) return;

      if (peer) {
        try {
          peer.destroy();
        } catch (e) {}
      }

      peer = null;
      myPeerId = null;
      inChat = false;

      startPeer();
    }, delay);
  }

  // ---------------------------------------------------------
  // Sessão
  // ---------------------------------------------------------

  function toggleSession() {
    if (!inChat) {
      if (connecting) return;

      intentionalDisconnect = false;
      reconnectAttempts = 0;

      startPeer();
      return;
    }

    disconnectEverything();
  }

  function disconnectEverything(showMessage = true) {
    intentionalDisconnect = true;

    clearTimeout(reconnectTimer);
    reconnectTimer = null;

    if (conn) {
      try {
        conn.close();
      } catch (e) {}
    }

    conn = null;
    remoteUser = {
      name: "Usuário",
      avatar: ""
    };

    if (peer) {
      try {
        peer.destroy();
      } catch (e) {}
    }

    peer = null;
    myPeerId = null;
    inChat = false;
    connecting = false;

    setStatus("● Fora do chat");

    sessionBtn.textContent = "Conectar Servidor";
    sessionBtn.classList.remove("btn-leave");
    sessionBtn.classList.add("btn-enter");

    connectPanel.style.display = "none";
    disableInput();

    myIdEl.textContent = "";

    if (showMessage) {
      addSystemMessage("Você saiu do chat.");
    }
  }

  // ---------------------------------------------------------
  // Reconexão P2P
  // ---------------------------------------------------------

  function scheduleReconnect(immediate = false) {
    const remoteId = localStorage.getItem(STORAGE_KEYS.remoteId);

    if (!remoteId || remoteId === myPeerId || intentionalDisconnect) {
      return;
    }

    clearTimeout(reconnectTimer);

    const delay = immediate
      ? 1500
      : Math.min(15000, 3000 + reconnectAttempts * 2000);

    reconnectTimer = setTimeout(() => {
      reconnectToSavedPeer();
    }, delay);
  }

  function reconnectToSavedPeer() {
    const remoteId = localStorage.getItem(STORAGE_KEYS.remoteId);

    if (
      !remoteId ||
      remoteId === myPeerId ||
      intentionalDisconnect
    ) {
      return;
    }

    if (!peer || peer.destroyed || peer.disconnected) {
      scheduleReconnect();
      return;
    }

    if (conn && conn.open) {
      return;
    }

    remoteIdInput.value = remoteId;

    addSystemMessage(
      "Tentando reconectar com " + remoteId + "..."
    );

    connectToPeer(true);
  }

  // ---------------------------------------------------------
  // Conectar a outro usuário
  // ---------------------------------------------------------

  function connectToPeer(autoReconnect = false) {
    const remoteId = remoteIdInput.value.trim();

    if (!remoteId) {
      if (!autoReconnect) {
        addSystemMessage("Digite o código do outro usuário.");
      }
      return;
    }

    if (!peer || !inChat) {
      if (!autoReconnect) {
        addSystemMessage(
          'Primeiro clique em "Conectar Servidor".'
        );
      }
      return;
    }

    if (remoteId === myPeerId) {
      addSystemMessage("Você não pode conectar consigo mesmo.");
      return;
    }

    if (conn && conn.open) {
      if (!autoReconnect) {
        addSystemMessage("Você já está conectado.");
      }
      return;
    }

    saveRemoteId(remoteId);

    connectBtn.disabled = true;

    if (!autoReconnect) {
      addSystemMessage("Conectando ao usuário...");
    }

    try {
      const newConn = peer.connect(remoteId, {
        reliable: true,
        serialization: "json"
      });

      conn = newConn;
      setupConnection(conn);
    } catch (error) {
      console.error(error);

      connectBtn.disabled = false;
      conn = null;

      if (!autoReconnect) {
        addSystemMessage("Não foi possível iniciar a conexão.");
      }

      scheduleReconnect();
    }
  }

  // ---------------------------------------------------------
  // Conexão P2P
  // ---------------------------------------------------------

  function setupConnection(connection) {
    if (!connection) return;

    connection.on("open", () => {
      connectBtn.disabled = false;
      reconnectAttempts = 0;

      saveRemoteId(connection.peer);

      setStatus(
        "● Conectado com " + connection.peer,
        true
      );

      enableInput();

      addSystemMessage("Conexão P2P estabelecida!");

      sendUserInfo(connection);
    });

    connection.on("data", (data) => {
      if (!data || typeof data !== "object") return;

      if (data.type === "user-info") {
        remoteUser = {
          name: data.senderName || "Usuário",
          avatar: data.avatarSrc || ""
        };

        setStatus(
          "● Conversando com " + remoteUser.name,
          true
        );

        return;
      }

      if (data.type === "message") {
        createMessageElement(
          data.text || "",
          "received",
          data.senderName || remoteUser.name || "Usuário",
          data.avatarSrc || remoteUser.avatar || userAvatarSrc,
          null,
          data.timestamp
        );

        return;
      }

      if (data.type === "image") {
        createMessageElement(
          "",
          "received",
          data.senderName || remoteUser.name || "Usuário",
          data.avatarSrc || remoteUser.avatar || userAvatarSrc,
          data.chatImageSrc,
          data.timestamp
        );
      }
    });

    connection.on("close", () => {
      connectBtn.disabled = false;

      if (conn === connection) {
        conn = null;
        disableInput();
        remoteUser = {
          name: "Usuário",
          avatar: ""
        };

        setStatus("● Online", true);

        addSystemMessage(
          "A conexão foi encerrada. Tentando reconectar..."
        );

        if (!intentionalDisconnect) {
          reconnectAttempts++;
          scheduleReconnect();
        }
      }
    });

    connection.on("error", (error) => {
      console.error("DataConnection:", error);
      connectBtn.disabled = false;

      if (conn === connection) {
        conn = null;
        disableInput();
      }

      addSystemMessage(
        "Erro na conexão com o usuário. Tentando novamente..."
      );

      if (!intentionalDisconnect) {
        reconnectAttempts++;
        scheduleReconnect();
      }
    });
  }

  function sendUserInfo(connection) {
    if (!connection || !connection.open) return;

    try {
      connection.send({
        type: "user-info",
        senderName: getUsername(),
        avatarSrc: userAvatarSrc
      });
    } catch (error) {
      console.error("sendUserInfo:", error);
    }
  }

  // ---------------------------------------------------------
  // Mensagens
  // ---------------------------------------------------------

  function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    if (!conn || !conn.open) {
      addSystemMessage(
        "Você não está conectado a outro usuário."
      );
      return;
    }

    const payload = {
      type: "message",
      senderName: getUsername(),
      avatarSrc: userAvatarSrc,
      text,
      timestamp: getCurrentTime()
    };

    try {
      conn.send(payload);

      createMessageElement(
        text,
        "sent",
        payload.senderName,
        payload.avatarSrc,
        null,
        payload.timestamp
      );

      inputEl.value = "";
      inputEl.focus();
    } catch (error) {
      console.error(error);
      addSystemMessage(
        "Não foi possível enviar a mensagem."
      );
    }
  }

  // ---------------------------------------------------------
  // Imagens
  // ---------------------------------------------------------

  function resizeImage(file, maxWidth = 1000) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();

      reader.onload = (event) => {
        const img = new Image();

        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            const ratio = maxWidth / width;
            width = maxWidth;
            height = height * ratio;
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          resolve(canvas.toDataURL("image/jpeg", 0.72));
        };

        img.onerror = reject;
        img.src = event.target.result;
      };

      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function sendImage(event) {
    const file = event.target.files[0];
    event.target.value = "";

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      addSystemMessage("Selecione uma imagem válida.");
      return;
    }

    if (!conn || !conn.open) {
      addSystemMessage("Você não está conectado.");
      return;
    }

    try {
      addSystemMessage("Preparando imagem...");

      const imageSrc = await resizeImage(file);

      const payload = {
        type: "image",
        senderName: getUsername(),
        avatarSrc: userAvatarSrc,
        chatImageSrc: imageSrc,
        timestamp: getCurrentTime()
      };

      conn.send(payload);

      createMessageElement(
        "",
        "sent",
        payload.senderName,
        payload.avatarSrc,
        imageSrc,
        payload.timestamp
      );
    } catch (error) {
      console.error(error);
      addSystemMessage(
        "Não foi possível enviar a imagem."
      );
    }
  }

  // ---------------------------------------------------------
  // Renderização
  // ---------------------------------------------------------

  function createMessageElement(
    text,
    type,
    senderName,
    avatarSrc,
    chatImageSrc = null,
    timeStr = null
  ) {
    const wrapper = document.createElement("div");
    wrapper.className = "message-wrapper " + type;

    const avatar = document.createElement("img");
    avatar.className = "msg-avatar";
    avatar.src = avatarSrc || userAvatarSrc;
    avatar.alt =
      "Avatar de " + (senderName || "Usuário");

    wrapper.appendChild(avatar);

    const msg = document.createElement("div");
    msg.className = "message";

    const nameSpan = document.createElement("span");
    nameSpan.className = "sender-name";
    nameSpan.textContent = senderName || "Usuário";
    msg.appendChild(nameSpan);

    if (chatImageSrc) {
      const img = document.createElement("img");
      img.className = "chat-image";
      img.src = chatImageSrc;
      img.alt = "Imagem enviada";
      img.loading = "lazy";
      msg.appendChild(img);
    }

    if (text) {
      const textSpan = document.createElement("span");
      textSpan.textContent = text;
      msg.appendChild(textSpan);
    }

    const timeSpan = document.createElement("span");
    timeSpan.className = "timestamp";
    timeSpan.textContent =
      timeStr || getCurrentTime();
    msg.appendChild(timeSpan);

    wrapper.appendChild(msg);
    messagesEl.appendChild(wrapper);

    scrollToBottom();
  }

  // ---------------------------------------------------------
  // Eventos
  // ---------------------------------------------------------

  sessionBtn.addEventListener("click", toggleSession);
  connectBtn.addEventListener("click", () => connectToPeer(false));
  sendBtn.addEventListener("click", sendMessage);
  imageInput.addEventListener("change", sendImage);

  usernameInput.addEventListener("change", () => {
    if (conn && conn.open) {
      sendUserInfo(conn);
    }
  });

  inputEl.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  remoteIdInput.addEventListener("input", () => {
    const id = remoteIdInput.value.trim();

    if (id) {
      saveRemoteId(id);
    }
  });

  remoteIdInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      event.preventDefault();
      connectToPeer(false);
    }
  });

  // ---------------------------------------------------------
  // Recuperação automática quando a aba volta a ter rede
  // ---------------------------------------------------------

  window.addEventListener("online", () => {
    if (intentionalDisconnect) return;

    addSystemMessage("Internet recuperada. Reconectando...");

    if (!peer || peer.destroyed) {
      startPeer();
    } else if (peer.disconnected) {
      try {
        peer.reconnect();
      } catch (e) {
        schedulePeerRestart();
      }
    }

    scheduleReconnect(true);
  });

  window.addEventListener("offline", () => {
    if (!intentionalDisconnect) {
      setStatus("● Sem internet");
      addSystemMessage(
        "Sem internet. A conexão será recuperada automaticamente."
      );
    }
  });

  // ---------------------------------------------------------
  // Não destruir a sessão ao apenas recarregar a página.
  // O ID continua no localStorage.
  // ---------------------------------------------------------

  window.addEventListener("beforeunload", () => {
    /*
      Não removemos:
        - timechat_peer_id
        - timechat_remote_id
        - timechat_avatar

      Assim o usuário mantém seu ID após atualizar ou fechar e abrir
      novamente o navegador.
    */

    try {
      if (conn) conn.close();
      if (peer) peer.destroy();
    } catch (e) {}
  });

</script>

</body>
</html>
